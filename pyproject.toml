[project]
name = "mrbalance-replay"
version = "0.1.0"
description = "Replay and improve MRBalance, a multi-agent debate framework for event causality identification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "backoff>=2.2",
    "httpx>=0.27",
    "openai>=1.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/paper_report",
    "/reference",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mrbalance_replay"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mrbalance_replay",
    "/tests",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.env.example",
    "/.editorconfig",
    "/.gitignore",
    "/.pre-commit-config.yaml",
]
exclude = [
    "/paper_report",
    "/reference",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["paper_report", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
exclude = [
    "^paper_report/",
    "^reference/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
